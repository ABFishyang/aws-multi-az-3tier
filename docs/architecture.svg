<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 860" width="1180" height="860" font-family="Helvetica, Arial, 'Noto Sans JP', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#5a6b7b"/>
    </marker>
    <marker id="arrowDash" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#b06a2c"/>
    </marker>
  </defs>

  <rect width="1180" height="860" fill="#ffffff"/>

  <text x="24" y="34" font-size="19" font-weight="700" fill="#16212b">AWS マルチAZ 3層Webアーキテクチャ</text>
  <text x="24" y="54" font-size="12" fill="#5a6b7b">CloudFormation 12スタック / ap-northeast-1</text>

  <!-- AWS Cloud -->
  <rect x="24" y="70" width="1132" height="762" fill="none" stroke="#232f3e" stroke-width="1.5" rx="4"/>
  <text x="36" y="88" font-size="11" font-weight="700" fill="#232f3e">AWS Cloud</text>

  <!-- Region -->
  <rect x="38" y="96" width="1104" height="722" fill="none" stroke="#0972d3" stroke-width="1.2" stroke-dasharray="5,3" rx="4"/>
  <text x="50" y="113" font-size="11" font-weight="700" fill="#0972d3">Region: ap-northeast-1 (Tokyo)</text>

  <!-- Internet users -->
  <circle cx="96" cy="176" r="17" fill="#eef3f8" stroke="#5a6b7b"/>
  <text x="96" y="181" font-size="10" text-anchor="middle" fill="#16212b">Users</text>
  <text x="96" y="210" font-size="9" text-anchor="middle" fill="#5a6b7b">Internet</text>

  <!-- IGW -->
  <rect x="150" y="158" width="62" height="34" fill="#e8f2fb" stroke="#0972d3" rx="3"/>
  <text x="181" y="173" font-size="9" text-anchor="middle" fill="#16212b">Internet</text>
  <text x="181" y="184" font-size="9" text-anchor="middle" fill="#16212b">Gateway</text>
  <line x1="115" y1="176" x2="146" y2="176" stroke="#5a6b7b" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- VPC -->
  <rect x="150" y="212" width="700" height="588" fill="none" stroke="#7d3ac1" stroke-width="1.4" rx="4"/>
  <text x="162" y="230" font-size="11" font-weight="700" fill="#7d3ac1">VPC  10.0.0.0/16</text>

  <!-- AZ A -->
  <rect x="164" y="240" width="330" height="548" fill="#fafbfc" stroke="#8899a8" stroke-dasharray="4,3" rx="3"/>
  <text x="176" y="257" font-size="10" font-weight="700" fill="#5a6b7b">Availability Zone: 1a</text>

  <!-- AZ C -->
  <rect x="506" y="240" width="330" height="548" fill="#fafbfc" stroke="#8899a8" stroke-dasharray="4,3" rx="3"/>
  <text x="518" y="257" font-size="10" font-weight="700" fill="#5a6b7b">Availability Zone: 1c</text>

  <!-- ===== Public subnets ===== -->
  <rect x="176" y="268" width="306" height="118" fill="#eaf6ec" stroke="#2e7d43" rx="3"/>
  <text x="186" y="284" font-size="10" font-weight="700" fill="#2e7d43">Public subnet  10.0.0.0/24</text>
  <rect x="518" y="268" width="306" height="118" fill="#eaf6ec" stroke="#2e7d43" rx="3"/>
  <text x="528" y="284" font-size="10" font-weight="700" fill="#2e7d43">Public subnet  10.0.1.0/24</text>

  <!-- ALB spanning -->
  <rect x="380" y="296" width="240" height="38" fill="#dcecfa" stroke="#0972d3" stroke-width="1.4" rx="3"/>
  <text x="500" y="312" font-size="11" font-weight="700" text-anchor="middle" fill="#16212b">Application Load Balancer</text>
  <text x="500" y="326" font-size="8.5" text-anchor="middle" fill="#5a6b7b">HTTP → HTTPS redirect / TLS 1.2+ / access log → S3</text>
  <line x1="181" y1="196" x2="181" y2="315" stroke="#5a6b7b" stroke-width="1.4"/>
  <line x1="181" y1="315" x2="376" y2="315" stroke="#5a6b7b" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- NAT GW -->
  <rect x="196" y="344" width="96" height="32" fill="#fdf0e3" stroke="#b06a2c" rx="3"/>
  <text x="244" y="364" font-size="9.5" text-anchor="middle" fill="#16212b">NAT Gateway</text>
  <rect x="538" y="344" width="96" height="32" fill="#fdf0e3" stroke="#b06a2c" rx="3"/>
  <text x="586" y="364" font-size="9.5" text-anchor="middle" fill="#16212b">NAT Gateway</text>

  <!-- ===== Private subnets ===== -->
  <rect x="176" y="400" width="306" height="176" fill="#e8f1fb" stroke="#0972d3" rx="3"/>
  <text x="186" y="416" font-size="10" font-weight="700" fill="#0972d3">Private subnet  10.0.10.0/24</text>
  <rect x="518" y="400" width="306" height="176" fill="#e8f1fb" stroke="#0972d3" rx="3"/>
  <text x="528" y="416" font-size="10" font-weight="700" fill="#0972d3">Private subnet  10.0.11.0/24</text>

  <!-- EC2 A -->
  <rect x="196" y="428" width="120" height="46" fill="#fdefe6" stroke="#d86613" stroke-width="1.3" rx="3"/>
  <text x="256" y="446" font-size="10.5" font-weight="700" text-anchor="middle" fill="#16212b">EC2  web-a</text>
  <text x="256" y="459" font-size="8" text-anchor="middle" fill="#5a6b7b">Apache + PHP</text>
  <text x="256" y="469" font-size="8" text-anchor="middle" fill="#5a6b7b">IMDSv2 required</text>

  <!-- EC2 C -->
  <rect x="538" y="428" width="120" height="46" fill="#fdefe6" stroke="#d86613" stroke-width="1.3" rx="3"/>
  <text x="598" y="446" font-size="10.5" font-weight="700" text-anchor="middle" fill="#16212b">EC2  web-b</text>
  <text x="598" y="459" font-size="8" text-anchor="middle" fill="#5a6b7b">Apache + PHP</text>
  <text x="598" y="469" font-size="8" text-anchor="middle" fill="#5a6b7b">IMDSv2 required</text>

  <!-- VPC Endpoints -->
  <rect x="330" y="496" width="140" height="60" fill="#f3ecfa" stroke="#7d3ac1" rx="3"/>
  <text x="400" y="513" font-size="9.5" font-weight="700" text-anchor="middle" fill="#16212b">VPC Endpoints</text>
  <text x="400" y="526" font-size="8" text-anchor="middle" fill="#5a6b7b">ssm / ssmmessages</text>
  <text x="400" y="537" font-size="8" text-anchor="middle" fill="#5a6b7b">ec2messages (Interface)</text>
  <text x="400" y="549" font-size="8" text-anchor="middle" fill="#5a6b7b">s3 (Gateway)</text>

  <line x1="316" y1="451" x2="376" y2="500" stroke="#7d3ac1" stroke-width="1.1" stroke-dasharray="3,2"/>
  <line x1="538" y1="451" x2="470" y2="500" stroke="#7d3ac1" stroke-width="1.1" stroke-dasharray="3,2"/>

  <!-- ALB -> EC2 -->
  <line x1="440" y1="336" x2="290" y2="424" stroke="#0972d3" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="560" y1="336" x2="620" y2="424" stroke="#0972d3" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- EC2 -> NAT -->
  <line x1="244" y1="428" x2="244" y2="380" stroke="#b06a2c" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrowDash)"/>
  <line x1="586" y1="428" x2="586" y2="380" stroke="#b06a2c" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrowDash)"/>

  <!-- ===== Protected subnets ===== -->
  <rect x="176" y="592" width="306" height="180" fill="#e6f4f6" stroke="#127b8c" rx="3"/>
  <text x="186" y="608" font-size="10" font-weight="700" fill="#127b8c">Protected subnet  10.0.20.0/24</text>
  <text x="186" y="620" font-size="8" fill="#5a6b7b">デフォルトルートなし</text>
  <rect x="518" y="592" width="306" height="180" fill="#e6f4f6" stroke="#127b8c" rx="3"/>
  <text x="528" y="608" font-size="10" font-weight="700" fill="#127b8c">Protected subnet  10.0.21.0/24</text>
  <text x="528" y="620" font-size="8" fill="#5a6b7b">デフォルトルートなし</text>

  <!-- RDS -->
  <rect x="196" y="632" width="120" height="46" fill="#e5edfa" stroke="#3b48cc" stroke-width="1.3" rx="3"/>
  <text x="256" y="650" font-size="10.5" font-weight="700" text-anchor="middle" fill="#16212b">RDS MySQL</text>
  <text x="256" y="663" font-size="8" text-anchor="middle" fill="#5a6b7b">Primary</text>
  <text x="256" y="673" font-size="8" text-anchor="middle" fill="#5a6b7b">encrypted</text>

  <rect x="538" y="632" width="120" height="46" fill="#e5edfa" stroke="#3b48cc" stroke-width="1.3" stroke-dasharray="4,3" rx="3"/>
  <text x="598" y="650" font-size="10.5" font-weight="700" text-anchor="middle" fill="#16212b">RDS MySQL</text>
  <text x="598" y="663" font-size="8" text-anchor="middle" fill="#5a6b7b">Standby</text>
  <text x="598" y="673" font-size="8" text-anchor="middle" fill="#5a6b7b">Multi-AZ</text>

  <line x1="316" y1="655" x2="534" y2="655" stroke="#3b48cc" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="425" y="650" font-size="8" text-anchor="middle" fill="#3b48cc">同期レプリケーション</text>

  <!-- EFS mount targets -->
  <rect x="196" y="694" width="120" height="40" fill="#e9f5ef" stroke="#2e7d43" rx="3"/>
  <text x="256" y="710" font-size="9.5" font-weight="700" text-anchor="middle" fill="#16212b">EFS mount target</text>
  <text x="256" y="723" font-size="8" text-anchor="middle" fill="#5a6b7b">TLS / encrypted</text>
  <rect x="538" y="694" width="120" height="40" fill="#e9f5ef" stroke="#2e7d43" rx="3"/>
  <text x="598" y="710" font-size="9.5" font-weight="700" text-anchor="middle" fill="#16212b">EFS mount target</text>
  <text x="598" y="723" font-size="8" text-anchor="middle" fill="#5a6b7b">TLS / encrypted</text>

  <!-- EC2 -> RDS / EFS -->
  <line x1="256" y1="474" x2="256" y2="628" stroke="#3b48cc" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="264" y="560" font-size="8" fill="#3b48cc">3306</text>
  <line x1="290" y1="474" x2="300" y2="690" stroke="#2e7d43" stroke-width="1.1" marker-end="url(#arrow)"/>
  <text x="304" y="560" font-size="8" fill="#2e7d43">2049</text>
  <line x1="598" y1="474" x2="598" y2="628" stroke="#3b48cc" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="632" y1="474" x2="642" y2="690" stroke="#2e7d43" stroke-width="1.1" marker-end="url(#arrow)"/>

  <!-- NACL labels -->
  <text x="470" y="282" font-size="8" text-anchor="end" fill="#2e7d43">NACL: 80/443/ephemeral</text>
  <text x="470" y="414" font-size="8" text-anchor="end" fill="#0972d3">NACL: VPC内 + ephemeral</text>
  <text x="470" y="606" font-size="8" text-anchor="end" fill="#127b8c">NACL: 3306 / 2049 のみ</text>

  <!-- ===== Right column: managed services ===== -->
  <rect x="872" y="240" width="256" height="176" fill="#fdfaf5" stroke="#b06a2c" rx="4"/>
  <text x="884" y="258" font-size="10.5" font-weight="700" fill="#b06a2c">運用・監視</text>

  <rect x="886" y="268" width="106" height="34" fill="#ffffff" stroke="#8899a8" rx="3"/>
  <text x="939" y="282" font-size="9" text-anchor="middle" fill="#16212b">CloudWatch</text>
  <text x="939" y="294" font-size="8" text-anchor="middle" fill="#5a6b7b">Alarm x6</text>

  <rect x="1004" y="268" width="106" height="34" fill="#ffffff" stroke="#8899a8" rx="3"/>
  <text x="1057" y="282" font-size="9" text-anchor="middle" fill="#16212b">AWS Health</text>
  <text x="1057" y="294" font-size="8" text-anchor="middle" fill="#5a6b7b">EventBridge</text>

  <rect x="886" y="318" width="224" height="34" fill="#ffffff" stroke="#8899a8" rx="3"/>
  <text x="998" y="332" font-size="9" text-anchor="middle" fill="#16212b">SNS Topic (単一に集約)</text>
  <text x="998" y="344" font-size="8" text-anchor="middle" fill="#5a6b7b">TopicPolicy: cloudwatch + events</text>

  <line x1="939" y1="304" x2="960" y2="314" stroke="#5a6b7b" stroke-width="1.1" marker-end="url(#arrow)"/>
  <line x1="1057" y1="304" x2="1036" y2="314" stroke="#5a6b7b" stroke-width="1.1" marker-end="url(#arrow)"/>

  <rect x="948" y="370" width="100" height="30" fill="#ffffff" stroke="#8899a8" rx="3"/>
  <text x="998" y="389" font-size="9" text-anchor="middle" fill="#16212b">Email 通知</text>
  <line x1="998" y1="354" x2="998" y2="366" stroke="#5a6b7b" stroke-width="1.1" marker-end="url(#arrow)"/>

  <!-- Session Manager -->
  <rect x="872" y="432" width="256" height="72" fill="#f7f3fc" stroke="#7d3ac1" rx="4"/>
  <text x="884" y="450" font-size="10.5" font-weight="700" fill="#7d3ac1">Session Manager</text>
  <text x="884" y="466" font-size="8.5" fill="#5a6b7b">踏み台サーバー不要</text>
  <text x="884" y="479" font-size="8.5" fill="#5a6b7b">22番ポートを開放しない</text>
  <text x="884" y="492" font-size="8.5" fill="#5a6b7b">操作ログは CloudTrail に記録</text>
  <line x1="868" y1="468" x2="474" y2="520" stroke="#7d3ac1" stroke-width="1.1" stroke-dasharray="3,2"/>

  <!-- S3 logs -->
  <rect x="872" y="520" width="256" height="96" fill="#eef6f0" stroke="#2e7d43" rx="4"/>
  <text x="884" y="538" font-size="10.5" font-weight="700" fill="#2e7d43">S3 ログバケット</text>
  <text x="884" y="554" font-size="8.5" fill="#5a6b7b">・VPC Flow Logs</text>
  <text x="884" y="567" font-size="8.5" fill="#5a6b7b">・ALB アクセスログ</text>
  <text x="884" y="580" font-size="8.5" fill="#5a6b7b">SSE-S3 / パブリックアクセス遮断</text>
  <text x="884" y="593" font-size="8.5" fill="#5a6b7b">ライフサイクル 90日で自動削除</text>
  <text x="884" y="606" font-size="8.5" fill="#5a6b7b">DeletionPolicy: Retain</text>
  <line x1="624" y1="315" x2="868" y2="545" stroke="#2e7d43" stroke-width="1.1" stroke-dasharray="3,2"/>

  <!-- Backup -->
  <rect x="872" y="632" width="256" height="88" fill="#fdf3f3" stroke="#c0392b" rx="4"/>
  <text x="884" y="650" font-size="10.5" font-weight="700" fill="#c0392b">AWS Backup</text>
  <text x="884" y="666" font-size="8.5" fill="#5a6b7b">日次 cron(0 16 ? * * *)</text>
  <text x="884" y="679" font-size="8.5" fill="#5a6b7b">対象: EC2 (タグ選択) + RDS</text>
  <text x="884" y="692" font-size="8.5" fill="#5a6b7b">保持 30日 / RPO 24h・RTO 1日</text>
  <text x="884" y="705" font-size="8.5" fill="#5a6b7b">DeletionPolicy: Retain</text>
  <line x1="662" y1="655" x2="868" y2="668" stroke="#c0392b" stroke-width="1.1" stroke-dasharray="3,2"/>
  <line x1="320" y1="450" x2="866" y2="648" stroke="#c0392b" stroke-width="0.9" stroke-dasharray="3,2" opacity="0.5"/>

  <!-- Secrets Manager -->
  <rect x="872" y="736" width="256" height="64" fill="#f5f0fb" stroke="#7d3ac1" rx="4"/>
  <text x="884" y="754" font-size="10.5" font-weight="700" fill="#7d3ac1">Secrets Manager</text>
  <text x="884" y="770" font-size="8.5" fill="#5a6b7b">RDS マネージドパスワード</text>
  <text x="884" y="783" font-size="8.5" fill="#5a6b7b">自動生成・自動ローテーション</text>
  <text x="884" y="796" font-size="8.5" fill="#5a6b7b">EC2 は起動時に IAM ロールで取得</text>
  <line x1="316" y1="474" x2="868" y2="756" stroke="#7d3ac1" stroke-width="0.9" stroke-dasharray="3,2" opacity="0.6"/>

  <!-- Legend -->
  <text x="164" y="812" font-size="8.5" fill="#5a6b7b">実線 = 通信経路 / 破線 = 管理・連携 / Protected 層はインターネットへの経路を持たない</text>
</svg>
