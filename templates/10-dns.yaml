AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Multi-AZ 3-Tier Architecture - 10 DNS / Certificate
  ACM 証明書 (DNS 検証) と Route 53 エイリアスレコード

# ------------------------------------------------------------------
# 【前提】
# Route 53 でホストゾーンを作成済みで、ドメインのネームサーバーが
# Route 53 に向いていること。独自ドメインを持っていない場合は
# このスタックをスキップし、09-loadbalancer を CertificateArn 空のまま
# デプロイすれば ALB の DNS 名で HTTP アクセスできる。
#
# 【デプロイ順序の注意】
# ACM 証明書 -> Route53 レコード -> ALB リスナー の順で依存する。
# 証明書の DNS 検証には数分かかり、その間スタックは CREATE_IN_PROGRESS のまま待機する。
# ------------------------------------------------------------------

Parameters:
  ProjectName:
    Type: String
    Default: myapp

  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: 既存の Route 53 ホストゾーン ID

  DomainName:
    Type: String
    Description: 証明書とレコードのドメイン名（例 app.example.com）
    AllowedPattern: '^[a-z0-9.-]+\.[a-z]{2,}$'

Resources:

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      # DNS 検証用の CNAME レコードを Route 53 に自動作成させる
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-cert'

  AliasRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !ImportValue
          Fn::Sub: '${ProjectName}-AlbDnsName'
        HostedZoneId: !ImportValue
          Fn::Sub: '${ProjectName}-AlbHostedZoneId'
        EvaluateTargetHealth: true

Outputs:
  CertificateArn:
    Value: !Ref Certificate
    Export:
      Name: !Sub '${ProjectName}-CertificateArn'
  SiteUrl:
    Value: !Sub 'https://${DomainName}/'
