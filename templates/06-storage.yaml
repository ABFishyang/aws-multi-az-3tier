AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Multi-AZ 3-Tier Architecture - 06 Storage
  EFS ファイルシステム / マウントターゲット x2AZ

# ------------------------------------------------------------------
# 【設計方針・参考記事からの修正点】
# 1. Encrypted: true で保存時暗号化を有効にする。
#    作成後には変更できないため最初から指定する。
# 2. マウントターゲットは Protected サブネットに置く。
#    そのため 01-network の Protected NACL で 2049 を許可しておくこと。
# 3. EC2 側は amazon-efs-utils による mount -t efs -o tls で接続する。
#    参考記事の mount -t nfs4 では転送時に暗号化されない。
# ------------------------------------------------------------------

Parameters:
  ProjectName:
    Type: String
    Default: myapp

  PerformanceMode:
    Type: String
    Default: generalPurpose
    AllowedValues:
      - generalPurpose
      - maxIO

  ThroughputMode:
    Type: String
    Default: bursting
    AllowedValues:
      - bursting
      - elastic
      - provisioned

Resources:

  FileSystem:
    Type: AWS::EFS::FileSystem
    DeletionPolicy: Delete
    Properties:
      Encrypted: true
      PerformanceMode: !Ref PerformanceMode
      ThroughputMode: !Ref ThroughputMode
      BackupPolicy:
        Status: ENABLED
      LifecyclePolicies:
        # 30日アクセスの無いファイルを低頻度アクセスに移して費用を抑える
        - TransitionToIA: AFTER_30_DAYS
        - TransitionToPrimaryStorageClass: AFTER_1_ACCESS
      FileSystemPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnforceTlsInTransit
            Effect: Deny
            Principal:
              AWS: '*'
            Action: '*'
            Condition:
              Bool:
                elasticfilesystem:AccessedViaMountTarget: 'true'
                aws:SecureTransport: 'false'
      FileSystemTags:
        - Key: Name
          Value: !Sub '${ProjectName}-efs'

  MountTargetA:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref FileSystem
      SubnetId: !ImportValue
        Fn::Sub: '${ProjectName}-ProtectedSubnetAId'
      SecurityGroups:
        - !ImportValue
          Fn::Sub: '${ProjectName}-EfsSgId'

  MountTargetB:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref FileSystem
      SubnetId: !ImportValue
        Fn::Sub: '${ProjectName}-ProtectedSubnetBId'
      SecurityGroups:
        - !ImportValue
          Fn::Sub: '${ProjectName}-EfsSgId'

Outputs:
  FileSystemId:
    Value: !Ref FileSystem
    Export:
      Name: !Sub '${ProjectName}-EfsFileSystemId'
