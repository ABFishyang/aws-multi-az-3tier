AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Multi-AZ 3-Tier Architecture - 09 Load Balancer
  ALB / ターゲットグループ / リスナー (HTTP -> HTTPS リダイレクト)

# ------------------------------------------------------------------
# 【設計方針・参考記事からの修正点】
# 1. HealthCheckPath は URL パス。参考記事は /mnt/efs/healthcheck.html という
#    ファイルシステムパスを指定しており、全ターゲットが Unhealthy になっていた。
#    さらに EC2 側が作るのは .php なのに .html を指定しており拡張子も不一致だった。
# 2. SslPolicy を明示する。既定の ELBSecurityPolicy-2016-08 は TLS1.0/1.1 を許容する。
# 3. アクセスログを有効にする場合、05-logging を先にデプロイしておくこと。
#    バケットポリシーが無いと ALB の作成自体が失敗する。
# 4. 証明書 ARN が未指定なら HTTP のみで構築できるよう条件分岐させている。
#    独自ドメインが無い状態でも動作確認できる。
# ------------------------------------------------------------------

Parameters:
  ProjectName:
    Type: String
    Default: myapp

  CertificateArn:
    Type: String
    Default: ''
    Description: ACM 証明書の ARN。空の場合は HTTP のみで構築する

  HealthCheckPath:
    Type: String
    Default: /healthcheck.php
    Description: URL パスを指定する（ファイルシステムパスではない）

  EnableAccessLogs:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']

Conditions:
  HasCertificate: !Not [!Equals [!Ref CertificateArn, '']]
  NoCertificate: !Equals [!Ref CertificateArn, '']
  UseAccessLogs: !Equals [!Ref EnableAccessLogs, 'true']

Resources:

  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      Subnets:
        - !ImportValue
          Fn::Sub: '${ProjectName}-PublicSubnetAId'
        - !ImportValue
          Fn::Sub: '${ProjectName}-PublicSubnetBId'
      SecurityGroups:
        - !ImportValue
          Fn::Sub: '${ProjectName}-AlbSgId'
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: '60'
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'true'
        - Key: access_logs.s3.enabled
          Value: !If [UseAccessLogs, 'true', 'false']
        - Key: access_logs.s3.bucket
          Value: !If
            - UseAccessLogs
            - !ImportValue
              Fn::Sub: '${ProjectName}-LogBucketName'
            - !Ref AWS::NoValue
        # バケットポリシーで許可したプレフィックスと必ず一致させること
        - Key: access_logs.s3.prefix
          Value: !If
            - UseAccessLogs
            - !ImportValue
              Fn::Sub: '${ProjectName}-AlbLogPrefix'
            - !Ref AWS::NoValue
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-alb'

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !ImportValue
        Fn::Sub: '${ProjectName}-VpcId'
      Protocol: HTTP
      Port: 80
      TargetType: instance
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPath: !Ref HealthCheckPath
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'
        - Key: stickiness.enabled
          Value: 'false'
      Targets:
        - Id: !ImportValue
            Fn::Sub: '${ProjectName}-WebServerAId'
          Port: 80
        - Id: !ImportValue
            Fn::Sub: '${ProjectName}-WebServerBId'
          Port: 80
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-tg-web'

  # 証明書がある場合: HTTP は HTTPS へリダイレクト
  HttpRedirectListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      LoadBalancerArn: !Ref Alb
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: '443'
            Host: '#{host}'
            Path: '/#{path}'
            Query: '#{query}'
            StatusCode: HTTP_301

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      LoadBalancerArn: !Ref Alb
      Protocol: HTTPS
      Port: 443
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # 証明書が無い場合: HTTP をそのままターゲットへ転送
  HttpForwardListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: NoCertificate
    Properties:
      LoadBalancerArn: !Ref Alb
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

Outputs:
  AlbDnsName:
    Value: !GetAtt Alb.DNSName
    Export:
      Name: !Sub '${ProjectName}-AlbDnsName'
  AlbHostedZoneId:
    Value: !GetAtt Alb.CanonicalHostedZoneID
    Export:
      Name: !Sub '${ProjectName}-AlbHostedZoneId'
  AlbArn:
    Value: !Ref Alb
    Export:
      Name: !Sub '${ProjectName}-AlbArn'
  TargetGroupArn:
    Value: !Ref TargetGroup
    Export:
      Name: !Sub '${ProjectName}-TargetGroupArn'
