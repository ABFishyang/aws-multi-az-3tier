AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Multi-AZ 3-Tier Architecture - 12 Backup
  AWS Backup ボールト / プラン / セレクション

# ------------------------------------------------------------------
# 【設計方針・参考記事からの修正点】
# 1. ScheduleExpression を必ず指定する。
#    参考記事では Description に「daily at 16:00 UTC」と書きながら
#    cron 指定が抜けており、バックアップが一度も自動実行されない状態だった。
#    プランもルールもコンソールに表示されるため気づきにくい。
# 2. 対象はタグで選択する。インスタンス ARN を直接列挙すると、
#    インスタンスを再作成するたびに書き換えが必要になる。
#    08-compute で Backup=true タグを付けてある。
# 3. RDS も対象に含める。参考記事は「RDS 自体に機能があるので省略」としていたが、
#    それでは AWS Backup で一元管理する意味が薄れる。
# 4. IAM ロールは 03-iam で作成済みのものを ImportValue で参照する。
#    参考記事は存在しないロールの ARN を参照していた。
# ------------------------------------------------------------------

Parameters:
  ProjectName:
    Type: String
    Default: myapp

  BackupScheduleUtc:
    Type: String
    Default: 'cron(0 16 ? * * *)'
    Description: 既定は毎日 16:00 UTC（日本時間 翌 01:00）

  DeleteAfterDays:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 365
    Description: 復旧ポイントの保持日数。RPO 24時間 / RTO 1日の要件に対応

Resources:

  BackupVault:
    Type: AWS::Backup::BackupVault
    # 誤ってスタックを消してもバックアップは残す
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BackupVaultName: !Sub '${ProjectName}-vault'
      BackupVaultTags:
        Name: !Sub '${ProjectName}-vault'

  BackupPlan:
    Type: AWS::Backup::BackupPlan
    Properties:
      BackupPlan:
        BackupPlanName: !Sub '${ProjectName}-daily-plan'
        BackupPlanRule:
          - RuleName: DailyBackup
            TargetBackupVault: !Ref BackupVault
            # これが無いと自動実行されない（参考記事の欠落箇所）
            ScheduleExpression: !Ref BackupScheduleUtc
            ScheduleExpressionTimezone: Asia/Tokyo
            StartWindowMinutes: 60
            CompletionWindowMinutes: 180
            EnableContinuousBackup: false
            Lifecycle:
              DeleteAfterDays: !Ref DeleteAfterDays
            RecoveryPointTags:
              Project: !Ref ProjectName

  BackupSelection:
    Type: AWS::Backup::BackupSelection
    Properties:
      BackupPlanId: !Ref BackupPlan
      BackupSelection:
        SelectionName: !Sub '${ProjectName}-tagged-resources'
        IamRoleArn: !ImportValue
          Fn::Sub: '${ProjectName}-BackupRoleArn'
        ListOfTags:
          - ConditionType: STRINGEQUALS
            ConditionKey: Backup
            ConditionValue: 'true'
        Resources:
          # EC2 はタグで、RDS は ARN で明示的に対象にする
          - !Sub 'arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:db:${ProjectName}-mysql'

Outputs:
  BackupVaultName:
    Value: !Ref BackupVault
    Export:
      Name: !Sub '${ProjectName}-BackupVaultName'
  BackupPlanId:
    Value: !Ref BackupPlan
    Export:
      Name: !Sub '${ProjectName}-BackupPlanId'
