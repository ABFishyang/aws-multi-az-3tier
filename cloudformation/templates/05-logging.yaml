AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Multi-AZ 3-Tier Architecture - 05 Logging
  ALB アクセスログ用 S3 / VPC フローログ用 S3 / VPC Flow Logs

# ------------------------------------------------------------------
# 【設計方針・参考記事からの修正点】
# 1. デプロイ順序: このスタックは 09-loadbalancer より「先に」作成する。
#    ALB にアクセスログを有効化する場合、バケットポリシーが先に無いと
#    ALB リソースの作成自体が失敗するため。
# 2. バケットポリシーの Principal にはサービスプリンシパルを使う。
#    参考記事は arn:aws:iam::リージョンID:root と書いており、
#    ARN の5番目のフィールド（アカウントID）にリージョンを入れる誤りがあった。
# 3. 許可パスと実際の配信先プレフィックスを一致させる。
#    ここがずれるとログは静かに配信されない（エラーが出ない）。
# 4. ライフサイクルルールで自動削除する。ログは放置すると増え続ける。
# ------------------------------------------------------------------

Parameters:
  ProjectName:
    Type: String
    Default: myapp

  AlbLogPrefix:
    Type: String
    Default: alb
    Description: ALB アクセスログのプレフィックス（末尾スラッシュ不要）

  FlowLogPrefix:
    Type: String
    Default: vpcflowlogs
    Description: VPC フローログのプレフィックス（末尾スラッシュ不要）

  LogRetentionDays:
    Type: Number
    Default: 90
    MinValue: 1
    MaxValue: 3650
    Description: ログの保持日数

Resources:

  # ---------- ログ用 S3 バケット ----------
  LogBucket:
    Type: AWS::S3::Bucket
    # スタック削除時にバケットを残す。ログは監査証跡になるため。
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${ProjectName}-logs-${AWS::AccountId}-${AWS::Region}'
      # ACL は非推奨。オブジェクト所有者をバケット所有者に強制する
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          # ALB アクセスログは SSE-S3 のみ対応（KMS カスタマーキーは不可）
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-logs
            Status: Enabled
            ExpirationInDays: !Ref LogRetentionDays
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-logs'

  LogBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref LogBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # --- ALB アクセスログ ---
          - Sid: AllowAlbLogDelivery
            Effect: Allow
            Principal:
              Service: logdelivery.elasticloadbalancing.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${LogBucket.Arn}/${AlbLogPrefix}/AWSLogs/${AWS::AccountId}/*'
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
                aws:SourceAccount: !Ref AWS::AccountId

          # --- VPC フローログ ---
          - Sid: AllowFlowLogDelivery
            Effect: Allow
            Principal:
              Service: delivery.logs.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${LogBucket.Arn}/${FlowLogPrefix}/AWSLogs/${AWS::AccountId}/*'
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
                aws:SourceAccount: !Ref AWS::AccountId

          - Sid: AllowFlowLogAclCheck
            Effect: Allow
            Principal:
              Service: delivery.logs.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt LogBucket.Arn
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

          # --- 平文通信の拒否 ---
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt LogBucket.Arn
              - !Sub '${LogBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false

  # ---------- VPC フローログ ----------
  VpcFlowLog:
    Type: AWS::EC2::FlowLog
    # バケットポリシーが先に存在しないと配信設定の検証に失敗する
    DependsOn: LogBucketPolicy
    Properties:
      ResourceType: VPC
      ResourceId: !ImportValue
        Fn::Sub: '${ProjectName}-VpcId'
      TrafficType: ALL
      LogDestinationType: s3
      # ポリシーで許可したパスと必ず一致させること
      LogDestination: !Sub '${LogBucket.Arn}/${FlowLogPrefix}/'
      MaxAggregationInterval: 600
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-vpc-flowlog'

Outputs:
  LogBucketName:
    Value: !Ref LogBucket
    Export:
      Name: !Sub '${ProjectName}-LogBucketName'
  LogBucketArn:
    Value: !GetAtt LogBucket.Arn
    Export:
      Name: !Sub '${ProjectName}-LogBucketArn'
  AlbLogPrefix:
    Value: !Ref AlbLogPrefix
    Export:
      Name: !Sub '${ProjectName}-AlbLogPrefix'
