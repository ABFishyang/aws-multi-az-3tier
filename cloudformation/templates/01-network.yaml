AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Multi-AZ 3-Tier Architecture - 01 Network
  VPC / IGW / Subnet x6 (Public・Private・Protected x 2AZ) / NAT Gateway x2 /
  Route Table x4 / Network ACL x3

# ------------------------------------------------------------------
# 【設計方針・参考記事からの修正点】
# 1. サブネットは /24 にする。参考記事の /28 は利用可能IPが11個しかなく、
#    EFS マウントターゲット・RDS Multi-AZ・将来の Auto Scaling を考えると過小。
# 2. IGW のアタッチ完了を DependsOn で明示する。
#    「IGW が VPC にアタッチされていること」は Ref からは推論できないため、
#    書かないと稀にタイミング依存で Route / NAT の作成が失敗する。
# 3. Public サブネットの MapPublicIpOnLaunch は false。
#    ここに置くのは ALB と NAT ゲートウェイだけで、EC2 は置かない。
# 4. Protected のルートテーブルにデフォルトルートを作らない。
#    RDS / EFS はマネージドサービスで外部通信が不要なため、
#    NAT への経路は攻撃面を増やすだけになる。
# 5. Private のルートテーブルは AZ ごとに分ける。
#    共有すると片方の NAT にしか向けられず、AZ 障害時に
#    もう一方の AZ まで巻き込まれ、冗長構成の意味が失われる。
# 6. NACL は層ごとに分ける。参考記事は全サブネット共通の1つで
#    インバウンド・アウトバウンドとも全許可しており、多層防御になっていない。
# 7. Protected NACL では 3306 (MySQL) に加えて 2049 (NFS) も許可する。
#    EFS マウントターゲットを Protected に置くため、
#    2049 を開けないと EC2 から EFS をマウントできない。
# ------------------------------------------------------------------

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: 基本設定
        Parameters:
          - ProjectName
      - Label:
          default: アベイラビリティゾーン
        Parameters:
          - AzA
          - AzB
      - Label:
          default: CIDR 設定
        Parameters:
          - VpcCidr
          - PublicSubnetACidr
          - PublicSubnetBCidr
          - PrivateSubnetACidr
          - PrivateSubnetBCidr
          - ProtectedSubnetACidr
          - ProtectedSubnetBCidr

Parameters:
  ProjectName:
    Type: String
    Default: myapp
    AllowedPattern: '^[a-z0-9-]+$'
    ConstraintDescription: 小文字の英数字とハイフンのみ
    Description: 全リソース名と Export 名の接頭辞。後続スタックでも同じ値を使う

  AzA:
    Type: AWS::EC2::AvailabilityZone::Name
    Default: ap-northeast-1a
    Description: 1つ目のAZ

  AzB:
    Type: AWS::EC2::AvailabilityZone::Name
    Default: ap-northeast-1c
    Description: 2つ目のAZ。東京リージョンでは 1b が使えないアカウントがあるため既定は 1c

  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'

  PublicSubnetACidr:
    Type: String
    Default: 10.0.0.0/24
    Description: ALB / NAT ゲートウェイを配置
  PublicSubnetBCidr:
    Type: String
    Default: 10.0.1.0/24

  PrivateSubnetACidr:
    Type: String
    Default: 10.0.10.0/24
    Description: Web/App の EC2 を配置
  PrivateSubnetBCidr:
    Type: String
    Default: 10.0.11.0/24

  ProtectedSubnetACidr:
    Type: String
    Default: 10.0.20.0/24
    Description: RDS / EFS を配置。デフォルトルートを持たない
  ProtectedSubnetBCidr:
    Type: String
    Default: 10.0.21.0/24

Resources:

  # ==================================================================
  # VPC / Internet Gateway
  # ==================================================================
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      # VPC エンドポイントのプライベート DNS 機能に両方とも必須
      EnableDnsSupport: true
      EnableDnsHostnames: true
      InstanceTenancy: default
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-vpc'

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-igw'

  IgwAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # ==================================================================
  # Subnet
  # ==================================================================
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Ref AzA
      CidrBlock: !Ref PublicSubnetACidr
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-public-a'

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Ref AzB
      CidrBlock: !Ref PublicSubnetBCidr
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-public-b'

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Ref AzA
      CidrBlock: !Ref PrivateSubnetACidr
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-private-a'

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Ref AzB
      CidrBlock: !Ref PrivateSubnetBCidr
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-private-b'

  ProtectedSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Ref AzA
      CidrBlock: !Ref ProtectedSubnetACidr
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-protected-a'

  ProtectedSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Ref AzB
      CidrBlock: !Ref ProtectedSubnetBCidr
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-protected-b'

  # ==================================================================
  # NAT Gateway (AZ ごとに1台 = 冗長構成)
  #   1台に減らせば費用は半分になるが、その AZ が落ちると
  #   もう一方の AZ の EC2 も外部通信できなくなる。
  # ==================================================================
  NatEipA:
    Type: AWS::EC2::EIP
    DependsOn: IgwAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-eip-natgw-a'

  NatEipB:
    Type: AWS::EC2::EIP
    DependsOn: IgwAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-eip-natgw-b'

  NatGatewayA:
    Type: AWS::EC2::NatGateway
    DependsOn: IgwAttachment
    Properties:
      AllocationId: !GetAtt NatEipA.AllocationId
      SubnetId: !Ref PublicSubnetA
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-natgw-a'

  NatGatewayB:
    Type: AWS::EC2::NatGateway
    DependsOn: IgwAttachment
    Properties:
      AllocationId: !GetAtt NatEipB.AllocationId
      SubnetId: !Ref PublicSubnetB
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-natgw-b'

  # ==================================================================
  # Route Table
  # ==================================================================
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-rtb-public'

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    # IGW アタッチ前にルートを作ると失敗する
    DependsOn: IgwAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARtAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRtAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTableA:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-rtb-private-a'

  PrivateDefaultRouteA:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTableA
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGatewayA

  PrivateSubnetARtAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTableA

  PrivateRouteTableB:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-rtb-private-b'

  PrivateDefaultRouteB:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTableB
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGatewayB

  PrivateSubnetBRtAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTableB

  # デフォルトルートを意図的に作らない。local ルートのみで VPC 内通信が成立する。
  ProtectedRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-rtb-protected'

  ProtectedSubnetARtAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref ProtectedSubnetA
      RouteTableId: !Ref ProtectedRouteTable

  ProtectedSubnetBRtAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref ProtectedSubnetB
      RouteTableId: !Ref ProtectedRouteTable

  # ==================================================================
  # Network ACL - Public
  #   ALB への 80/443 と、NAT ゲートウェイの戻り通信 (エフェメラル) を許可
  # ==================================================================
  PublicNacl:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-nacl-public'

  PublicNaclInHttps:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PublicNacl
      RuleNumber: 100
      Protocol: 6
      RuleAction: allow
      Egress: false
      CidrBlock: 0.0.0.0/0
      PortRange:
        From: 443
        To: 443

  PublicNaclInHttp:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PublicNacl
      RuleNumber: 110
      Protocol: 6
      RuleAction: allow
      Egress: false
      CidrBlock: 0.0.0.0/0
      PortRange:
        From: 80
        To: 80

  # NAT ゲートウェイが中継した外向き通信の戻りパケットを受けるために必要
  PublicNaclInEphemeral:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PublicNacl
      RuleNumber: 120
      Protocol: 6
      RuleAction: allow
      Egress: false
      CidrBlock: 0.0.0.0/0
      PortRange:
        From: 1024
        To: 65535

  PublicNaclOutAll:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PublicNacl
      RuleNumber: 100
      Protocol: -1
      RuleAction: allow
      Egress: true
      CidrBlock: 0.0.0.0/0

  PublicSubnetANaclAssoc:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      NetworkAclId: !Ref PublicNacl

  PublicSubnetBNaclAssoc:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      NetworkAclId: !Ref PublicNacl

  # ==================================================================
  # Network ACL - Private
  # ==================================================================
  PrivateNacl:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-nacl-private'

  PrivateNaclInVpc:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PrivateNacl
      RuleNumber: 100
      Protocol: -1
      RuleAction: allow
      Egress: false
      CidrBlock: !Ref VpcCidr

  # NAT 経由の外向き通信の戻り。送信元 IP はインターネット側のままなので
  # 0.0.0.0/0 からのエフェメラルポートを許可する必要がある
  PrivateNaclInEphemeral:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PrivateNacl
      RuleNumber: 110
      Protocol: 6
      RuleAction: allow
      Egress: false
      CidrBlock: 0.0.0.0/0
      PortRange:
        From: 1024
        To: 65535

  PrivateNaclOutAll:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PrivateNacl
      RuleNumber: 100
      Protocol: -1
      RuleAction: allow
      Egress: true
      CidrBlock: 0.0.0.0/0

  PrivateSubnetANaclAssoc:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      NetworkAclId: !Ref PrivateNacl

  PrivateSubnetBNaclAssoc:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      NetworkAclId: !Ref PrivateNacl

  # ==================================================================
  # Network ACL - Protected
  #   VPC 内部との通信のみ。インターネットとの経路は一切持たない。
  # ==================================================================
  ProtectedNacl:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-nacl-protected'

  ProtectedNaclInMysql:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref ProtectedNacl
      RuleNumber: 100
      Protocol: 6
      RuleAction: allow
      Egress: false
      CidrBlock: !Ref VpcCidr
      PortRange:
        From: 3306
        To: 3306

  # EFS マウントターゲットをこの層に置くため NFS を許可する
  ProtectedNaclInNfs:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref ProtectedNacl
      RuleNumber: 105
      Protocol: 6
      RuleAction: allow
      Egress: false
      CidrBlock: !Ref VpcCidr
      PortRange:
        From: 2049
        To: 2049

  ProtectedNaclInEphemeral:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref ProtectedNacl
      RuleNumber: 110
      Protocol: 6
      RuleAction: allow
      Egress: false
      CidrBlock: !Ref VpcCidr
      PortRange:
        From: 1024
        To: 65535

  ProtectedNaclOutEphemeral:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref ProtectedNacl
      RuleNumber: 100
      Protocol: 6
      RuleAction: allow
      Egress: true
      CidrBlock: !Ref VpcCidr
      PortRange:
        From: 1024
        To: 65535

  # RDS Multi-AZ のスタンバイとの同期通信を通すために必要
  ProtectedNaclOutMysql:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref ProtectedNacl
      RuleNumber: 110
      Protocol: 6
      RuleAction: allow
      Egress: true
      CidrBlock: !Ref VpcCidr
      PortRange:
        From: 3306
        To: 3306

  ProtectedNaclOutNfs:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref ProtectedNacl
      RuleNumber: 120
      Protocol: 6
      RuleAction: allow
      Egress: true
      CidrBlock: !Ref VpcCidr
      PortRange:
        From: 2049
        To: 2049

  ProtectedSubnetANaclAssoc:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties:
      SubnetId: !Ref ProtectedSubnetA
      NetworkAclId: !Ref ProtectedNacl

  ProtectedSubnetBNaclAssoc:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties:
      SubnetId: !Ref ProtectedSubnetB
      NetworkAclId: !Ref ProtectedNacl

# ==================================================================
# Outputs
#   Export 名はアカウント / リージョン内で一意である必要があるため、
#   必ず ProjectName を含めて衝突を避ける。
# ==================================================================
Outputs:
  VpcId:
    Value: !Ref Vpc
    Export:
      Name: !Sub '${ProjectName}-VpcId'

  VpcCidr:
    Value: !GetAtt Vpc.CidrBlock
    Export:
      Name: !Sub '${ProjectName}-VpcCidr'

  PublicSubnetAId:
    Value: !Ref PublicSubnetA
    Export:
      Name: !Sub '${ProjectName}-PublicSubnetAId'
  PublicSubnetBId:
    Value: !Ref PublicSubnetB
    Export:
      Name: !Sub '${ProjectName}-PublicSubnetBId'

  PrivateSubnetAId:
    Value: !Ref PrivateSubnetA
    Export:
      Name: !Sub '${ProjectName}-PrivateSubnetAId'
  PrivateSubnetBId:
    Value: !Ref PrivateSubnetB
    Export:
      Name: !Sub '${ProjectName}-PrivateSubnetBId'

  ProtectedSubnetAId:
    Value: !Ref ProtectedSubnetA
    Export:
      Name: !Sub '${ProjectName}-ProtectedSubnetAId'
  ProtectedSubnetBId:
    Value: !Ref ProtectedSubnetB
    Export:
      Name: !Sub '${ProjectName}-ProtectedSubnetBId'

  PublicRouteTableId:
    Value: !Ref PublicRouteTable
    Export:
      Name: !Sub '${ProjectName}-PublicRouteTableId'
  PrivateRouteTableAId:
    Value: !Ref PrivateRouteTableA
    Export:
      Name: !Sub '${ProjectName}-PrivateRouteTableAId'
  PrivateRouteTableBId:
    Value: !Ref PrivateRouteTableB
    Export:
      Name: !Sub '${ProjectName}-PrivateRouteTableBId'
  ProtectedRouteTableId:
    Value: !Ref ProtectedRouteTable
    Export:
      Name: !Sub '${ProjectName}-ProtectedRouteTableId'
