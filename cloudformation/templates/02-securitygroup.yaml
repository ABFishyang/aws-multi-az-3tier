AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Multi-AZ 3-Tier Architecture - 02 Security Group
  ALB / EC2 / RDS / EFS / VPC Endpoint 用のセキュリティグループ

# ------------------------------------------------------------------
# 【設計方針】
# 1. ソースには CIDR ではなくセキュリティグループIDを指定する（SGチェーン）。
#    IPアドレスが変わっても設定を追従させる必要がなくなる。
# 2. セキュリティグループはステートフルなので、戻り方向のルールは作らない。
#    EC2 -> RDS:3306 を許可すれば、RDS からの応答は自動的に通る。
# 3. ALB と EC2 は相互参照になるため、インラインではなく
#    AWS::EC2::SecurityGroupIngress / Egress を別リソースとして定義する。
#    インラインで書くと循環参照エラーになる。
# ------------------------------------------------------------------

Parameters:
  ProjectName:
    Type: String
    Default: myapp
    Description: 01-network と同じ値を指定すること

Resources:

  # ---------- ALB 用 ----------
  AlbSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Application Load Balancer
      VpcId: !ImportValue
        Fn::Sub: '${ProjectName}-VpcId'
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP from Internet (redirected to HTTPS)
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS from Internet
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-alb-sg'

  # ---------- EC2 用 ----------
  Ec2Sg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Web/App EC2 instances
      VpcId: !ImportValue
        Fn::Sub: '${ProjectName}-VpcId'
      # インバウンドは AlbToEc2Ingress で別途定義（循環参照回避）
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-ec2-sg'

  # ALB -> EC2 (HTTP)
  AlbToEc2Ingress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref Ec2Sg
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      SourceSecurityGroupId: !Ref AlbSg
      Description: HTTP from ALB

  # ALB のアウトバウンドをターゲットのみに限定する
  AlbToEc2Egress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref AlbSg
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      DestinationSecurityGroupId: !Ref Ec2Sg
      Description: HTTP to EC2 targets

  # ---------- RDS 用 ----------
  RdsSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for RDS MySQL
      VpcId: !ImportValue
        Fn::Sub: '${ProjectName}-VpcId'
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref Ec2Sg
          Description: MySQL from EC2 only
      # アウトバウンドは不要。ダミールールで全許可を打ち消す
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 127.0.0.1/32
          Description: No outbound required
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-rds-sg'

  # ---------- EFS 用 ----------
  EfsSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for EFS mount targets
      VpcId: !ImportValue
        Fn::Sub: '${ProjectName}-VpcId'
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          SourceSecurityGroupId: !Ref Ec2Sg
          Description: NFS from EC2 only
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 127.0.0.1/32
          Description: No outbound required
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-efs-sg'

  # ---------- VPC エンドポイント (Interface) 用 ----------
  VpceSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for SSM Interface VPC Endpoints
      VpcId: !ImportValue
        Fn::Sub: '${ProjectName}-VpcId'
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref Ec2Sg
          Description: HTTPS from EC2
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 127.0.0.1/32
          Description: No outbound required
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-vpce-sg'

Outputs:
  AlbSgId:
    Value: !Ref AlbSg
    Export:
      Name: !Sub '${ProjectName}-AlbSgId'
  Ec2SgId:
    Value: !Ref Ec2Sg
    Export:
      Name: !Sub '${ProjectName}-Ec2SgId'
  RdsSgId:
    Value: !Ref RdsSg
    Export:
      Name: !Sub '${ProjectName}-RdsSgId'
  EfsSgId:
    Value: !Ref EfsSg
    Export:
      Name: !Sub '${ProjectName}-EfsSgId'
  VpceSgId:
    Value: !Ref VpceSg
    Export:
      Name: !Sub '${ProjectName}-VpceSgId'
