AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Multi-AZ 3-Tier Architecture - 11 Monitoring
  SNS トピック / TopicPolicy / CloudWatch アラーム / EventBridge (AWS Health)

# ------------------------------------------------------------------
# 【設計方針・参考記事からの修正点】
# 1. SNS トピックは1つに集約する。参考記事では Health 用・メトリクス用・
#    エラーログ用で3つに分かれており、購読確認メールも3回必要だった。
# 2. AWS::SNS::TopicPolicy を必ず作る。
#    これが無いと EventBridge から SNS への publish が権限不足で失敗する。
#    スタックは正常に作成され、コンソールにもルールとターゲットが表示されるため、
#    通知が届かないことに気づけない（サイレント障害）。
# 3. aws:SourceAccount 条件を付けて Confused Deputy 問題を防ぐ。
# 4. InsufficientDataActions は設定しない。
#    EC2 停止時などにデータ欠損で大量の通知が発生し、
#    本当に見るべき通知が埋もれる。
# ------------------------------------------------------------------

Parameters:
  ProjectName:
    Type: String
    Default: myapp

  NotificationEmail:
    Type: String
    Description: 通知先メールアドレス（デプロイ後に届く確認メールを承認すること）
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[a-zA-Z]{2,}$'

  CpuAlarmThreshold:
    Type: Number
    Default: 80
    MinValue: 1
    MaxValue: 100

Resources:

  # ---------- SNS ----------
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${ProjectName}-alerts'
      DisplayName: !Sub '${ProjectName} Alerts'
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-alerts'

  AlertSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  AlertTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref AlertTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudWatchAlarmPublish
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: !Ref AlertTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

          - Sid: AllowEventBridgePublish
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref AlertTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  # ---------- CloudWatch アラーム (EC2) ----------
  CpuAlarmA:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-web-a-cpu-high'
      AlarmDescription: EC2 (AZ-a) CPU utilization is high
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Dimensions:
        - Name: InstanceId
          Value: !ImportValue
            Fn::Sub: '${ProjectName}-WebServerAId'
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: !Ref CpuAlarmThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic

  CpuAlarmB:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-web-b-cpu-high'
      AlarmDescription: EC2 (AZ-b) CPU utilization is high
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Dimensions:
        - Name: InstanceId
          Value: !ImportValue
            Fn::Sub: '${ProjectName}-WebServerBId'
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: !Ref CpuAlarmThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic

  # ---------- CloudWatch アラーム (ALB) ----------
  UnhealthyHostAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-alb-unhealthy-hosts'
      AlarmDescription: ALB has unhealthy targets
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - Name: TargetGroup
          Value: !ImportValue
            Fn::Sub: '${ProjectName}-TargetGroupArn'
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic

  Http5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-alb-5xx'
      AlarmDescription: ALB returned 5xx responses
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_ELB_5XX_Count
      Dimensions:
        - Name: LoadBalancer
          Value: !ImportValue
            Fn::Sub: '${ProjectName}-AlbArn'
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  # ---------- CloudWatch アラーム (RDS) ----------
  RdsCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-rds-cpu-high'
      AlarmDescription: RDS CPU utilization is high
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Sub '${ProjectName}-mysql'
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: !Ref CpuAlarmThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  RdsFreeStorageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-rds-low-storage'
      AlarmDescription: RDS free storage space is low (under 2GB)
      Namespace: AWS/RDS
      MetricName: FreeStorageSpace
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Sub '${ProjectName}-mysql'
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 2147483648
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  # ---------- EventBridge: AWS Health ----------
  HealthEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-aws-health-issue'
      Description: Notify AWS Health events categorized as issue
      State: ENABLED
      EventPattern:
        source:
          - aws.health
        detail-type:
          - AWS Health Event
        detail:
          # issue のみに絞る。accountNotification などの
          # 情報通知まで拾うとノイズが多くなる
          eventTypeCategory:
            - issue
      Targets:
        - Id: SendToSns
          Arn: !Ref AlertTopic

Outputs:
  AlertTopicArn:
    Value: !Ref AlertTopic
    Export:
      Name: !Sub '${ProjectName}-AlertTopicArn'
